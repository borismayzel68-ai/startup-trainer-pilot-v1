# MOS-6 · Render Blueprint: закрытый staging. Секреты — только в Render dashboard (sync: false), в репо их нет.
# Выпуск на живых пользователей — только после явного утверждения Бориса.
databases:
  - name: mos-staging-db
    plan: basic-256mb
    databaseName: mos_staging
    user: mos
    ipAllowList: []   # внешний доступ к БД закрыт, только внутренняя сеть Render

services:
  - type: web
    name: mos-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn -b 0.0.0.0:$PORT --timeout 120 app:app   # без hq018_seed: seed вручную, см. docs/DEPLOY.md
    preDeployCommand: python scripts/hq018_migrate.py              # миграции при каждом деплое (идемпотентны)
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: mos-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_ALLOWLIST
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: S1_LLM_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
