# HQ-020 · Рабочие значения до итогов пилота (решения PM 11.10). Всё здесь — «рабочее».
# methodology.yaml (веса, пороги, потолки) НЕ меняется.
status: рабочее
pack_block1:            # путь IT — общие пороги yaml через map; путь LS — LS §2.3 по К1–К7 (HQ-059/13.1), ниже
  label: "рабочие пороги (общие пороги yaml)"
  map: {NEXT: "READY FOR INVESTOR CONVERSATION", HOLD: "ITERATE", PASS: "NOT READY"}
  ls:
    label: "рабочие пороги LS_CHECKLIST_S1_v0.2 §2.3 по К1–К7 (+ «дыры» §2.3 закрыты правилом PM, на утверждении)"
    labels: {not_ready: "NOT READY", iterate: "ITERATE", ready: "READY FOR INVESTOR CONVERSATION"}
    # перевод E0–E4 → балл К 0–5 (PM S1, 13.4); обратно: 0–1→E0, 2→E1, 3→E2, 4→E3, 5→E4
    k_score: {0: 1, 1: 2, 2: 3, 3: 4, 4: 5}
    not_ready_if_le_1: [К1, К2, К4]     # балл 0–1 → NOT READY (SC П-2; К1 — правка 13.3)
    ready_min: {К1: 3, К2: 3, К3: 3, К4: 3}
    ready_min_or_na: {К5: 2, К6: 2}     # ≥ 2 либо N/A по стадии с причиной
    # К7 — не слот чек-листа (это «следующий артефакт»), в статус не входит; НЕ ПОДТВЕРЖДЕНО до решения PM S1
pack_block8:
  horizons: ["30 дней", "60 дней", "90 дней"]
  not_specified: "не указано"
limits: {r0: 7, r1: 12, r2: 5}          # рабочее
r2_deadline_days: 14                    # рабочее; после срока — статус «истёк», можно возобновить
r1_drug_hospital_question:              # З2, только ЛП, в пределах лимита Р1 (текст — ls_zone_signals.hospital_drug)
  id: Q1.Z2
  signal: hospital_drug

# HQ-035 · подпись факта (канон Р-5). Кто подписывает — не решено (G-13): только роли, без имён.
# Роль подписанта задаётся в окружении S1_APPROVER_ROLES «имя:роль;…» (имена — из S1_APPROVERS).
fact_signoff:
  signer_roles: [analyst]
  public_labels: {FACT: "факт", FACT_CANDIDATE: "заявление с документом", FOUNDER_CLAIM: "заявление",
                  UNKNOWN: "нет данных", CONFLICT: "противоречие"}

# HQ-028 · Выход S1 (бриф HQ-028, канон v1.7 Д-2…Д-6, Д-9)
hq028:
  link_ttl_days: 14              # бриф п. 3: по умолчанию 14 дней, настраивается (S1_LINK_TTL_S)
  fund_window_days: 21           # бриф п. 5 / Д-2
  fund_recipient: fund           # получатель «фонд» — окно 21 день его не блокирует
  disclaimer: "Не инвестиционная рекомендация"
  teaser_items: 3                # Д-5: по три сильных стороны и риска
  # решение фонда в тизере — только из списка (PM 11.10; может измениться после OK-1)
  fund_decisions: ["фонд изучает", "фонд участвует", "фонд не участвует"]
  timer_task_title: "окно фонда истекло, решение?"
  deck_ngram_words: 6            # рабочее: совпадение ≥ 6 слов подряд с текстом деки = свободный текст из деки
  name_stem_letters: 5      # рабочее (PM 11.10): имена из чёрного списка ловятся по первым 5 буквам; короче 5 — точно
  name_stopwords: ["CEO", "CTO", "COO", "CFO", "CSO", "PhD", "MD", "MBA", "Оба", "Вестинг", "ООО", "LLC", "GmbH"]
  # Проверка обезличивания (п. 4 / Д-5): рабочие шаблоны поиска — утвердить PM
  deid:
    patent_patterns: ['\bRU\s?\d{6,}', '\bWO\s?\d{4}\s?/\s?\d+', '\bUS\s?\d{7,}', '\bEP\s?\d{6,}', '№\s?\d{6,}', 'патент\w*\s+(?:№\s?)?\d{4,}']
    clinic_words: ["клиник", "больниц", "госпитал", "hospital", "clinic", "медцентр", "медицинский центр", "НМИЦ", "НИИ "]
