# =============================================================================
# S1 · БП-01 «Стартап до раунда» — методология Readiness Pack
#
# Чек-лист НЕ задаётся здесь: он строится из канона репозитория —
# routing_v2.route() выбирает модули по юрисдикции и классу продукта,
# question_engine_v2.SLOT_CATALOG даёт слоты модулей. Здесь только:
#   - группировка модулей в 7 блоков Deal Genome и их веса;
#   - короткие подписи слотов для отчётов;
#   - доп. слоты «готовности к раунду», которых нет в тренажёре;
#   - критичные слоты (гейт вердикта), шкала E0–E4, пороги, поля формы Tilda.
#
# ДОПУЩЕНИЯ, требующие утверждения: названия/веса 7 блоков, маппинг модулей в
# блоки, список критичных слотов, пороги вердикта.
# =============================================================================

version: "0.2-draft"
output_language: "ru"

thesis:
  description: >
    Технологические стартапы ранних стадий (Seed / Round A): Biotech, MedTech, IT.
  out_of_thesis_is_pass: true

# --- Шкала доказательности (канон PROJECT CONTEXT, раздел 2) -----------------
evidence_scale:
  0: {code: E0, label: "Founder claim", description: "Заявление основателя без документального подтверждения: слова в анкете, невалидированные метрики."}
  1: {code: E1, label: "Unverified", description: "Прогнозы и расчёты без явных формул и источников (питч-дек, захардкоженная модель)."}
  2: {code: E2, label: "Self-reported", description: "Данные управленческого учёта, скрины кабинетов, фактические цифры в финмодели с формулами."}
  3: {code: E3, label: "Fact (verified)", description: "Подтверждённые договоры, первичные акты, банковские выписки — загружены как доказательство."}
  4: {code: E4, label: "Audited fact", description: "Аудированная отчётность, записи в госреестрах (ЕГРЮЛ, ФИПС). Машина не присваивает: только после проверки аналитиком в самом реестре."}

evidence_value: {0: 0.10, 1: 0.25, 2: 0.50, 3: 0.85, 4: 1.00}

# Потолок уровня по источнику — главный предохранитель от «щедрой» модели и
# prompt-injection: самоотчёт фаундера не может стать фактом.
source_level_cap:
  form: 0
  deck: 1
  model: 2      # финмодель без формул -> E1 (см. model_min_formulas)
  evidence: 3   # документ третьей стороны; подлинность машина не проверяет
model_min_formulas: 10
fact_min_level: 3

# --- 7 блоков Deal Genome: группировка модулей канона -------------------------
blocks:
  - key: team
    label: "Команда и управление"
    weight: 0.15
    modules: [team_governance]
  - key: problem_market
    label: "Проблема, клиент и рынок"
    weight: 0.15
    modules: [problem_unmet_need, customer_buyer_payer, market]
  - key: product
    label: "Продукт, технология и защита"
    weight: 0.15
    modules: [product_intended_use, competition_moat, science_mechanism, clinical,
              diagnostics_validity, cmc_manufacturing, ai_data_cybersecurity,
              ls_milestones_product]   # HQ-016: К1, К4, К5 — только при LS-правиле
  - key: traction
    label: "Тракшн и пилоты"
    weight: 0.20
    modules: [traction, pilots_workflow]
  - key: business_model
    label: "Бизнес-модель и доступ к рынку"
    weight: 0.10
    modules: [business_model, market_access_procurement_reimbursement,
              ls_milestones_market]    # HQ-016: К6 — только при LS-правиле
  - key: finance_round
    label: "Финансы и раунд"
    weight: 0.15
    modules: [financing_milestone, round_readiness]
  - key: risks_legal
    label: "Регуляторика, IP и юрструктура"
    weight: 0.10
    modules: [regulatory, ip_fto, legal_readiness,
              ls_milestones_risks]     # HQ-016: К2, К3 — только при LS-правиле

# Слоты готовности к раунду, которых нет в тренажёре (добавляются всегда).
extra_modules:
  round_readiness:
    - {slot: burn_runway, why: "Burn rate, остаток денег и runway в месяцах."}
    - {slot: round_terms, why: "Размер чека/раунда, оценка, инструмент; сверка анкета ↔ финмодель."}
  legal_readiness:
    - {slot: legal_entity, why: "Юрлицо (ЕГРЮЛ), холдинг, кэп-тейбл, бенефициары."}

# Короткие подписи для отчётов (fallback — поле why из SLOT_CATALOG).
slot_labels:
  team_governance.critical_roles: "Ключевые компетенции и пробелы в команде"
  team_governance.ownership: "Доли, права на разработки, управление"
  problem_unmet_need.target_problem: "Проблема, пользователь, контекст"
  problem_unmet_need.pain_evidence: "Первичные данные о боли клиента"
  customer_buyer_payer.roles: "Пользователь / покупатель / плательщик"
  customer_buyer_payer.purchase_process: "Процесс и критерии закупки"
  market.beachhead: "Первый сегмент (beachhead)"
  market.market_method: "Расчёт рынка снизу вверх"
  product_intended_use.intended_use: "Назначение продукта"
  product_intended_use.workflow_boundary: "Границы функций продукта"
  competition_moat.alternatives: "Альтернативы и причины переключения"
  competition_moat.defensibility: "Трудновоспроизводимое преимущество (moat)"
  science_mechanism.mechanism: "Механизм действия"
  science_mechanism.translational_evidence: "Трансляционные данные"
  clinical.clinical_plan: "Клинический план"
  clinical.endpoints: "Конечные точки и критерии успеха"
  diagnostics_validity.analytical_validity: "Аналитическая валидность"
  diagnostics_validity.clinical_validity: "Клиническая валидность"
  cmc_manufacturing.process_control: "Контроль производства и качества"
  cmc_manufacturing.scale_quality: "Масштабирование производства"
  ai_data_cybersecurity.data_provenance: "Происхождение и права на данные"
  ai_data_cybersecurity.validation_monitoring: "Валидация модели и мониторинг"
  ai_data_cybersecurity.privacy_security: "Приватность и безопасность данных"
  traction.traction_metrics: "Измеримые результаты у клиентов"
  traction.retention: "Удержание и повторное использование"
  pilots_workflow.pilot_design: "Дизайн пилота и критерии успеха"
  pilots_workflow.workflow_integration: "Встраивание в процесс клиента"
  business_model.pricing: "Модель монетизации и цена"
  business_model.unit_economics: "Юнит-экономика (выручка, маржа, CAC, churn)"
  market_access_procurement_reimbursement.procurement: "Путь закупки"
  market_access_procurement_reimbursement.reimbursement: "Кто оплачивает / возмещение"
  financing_milestone.funding_need: "Объём и срок финансирования"
  financing_milestone.milestone_plan: "Проверяемая веха на эти деньги"
  round_readiness.burn_runway: "Burn rate и runway"
  round_readiness.round_terms: "Размер чека, оценка, инструмент"
  regulatory.classification_route: "Регуляторный статус и маршрут"
  regulatory.submission_evidence: "Пакет доказательств для регулятора"
  ip_fto.ip_position: "Права на IP (патенты, ФИПС)"
  ip_fto.fto: "Анализ свободы действий (FTO)"
  legal_readiness.legal_entity: "Юрлицо (ЕГРЮЛ), холдинг, кэп-тейбл"

# Критичные слоты: пробел/конфликт блокирует NEXT. Учитываются, только если
# модуль выбран маршрутизацией (ip_fto, regulatory — не у всех).
critical_slots:
  - problem_unmet_need.pain_evidence
  - team_governance.critical_roles
  - team_governance.ownership
  - traction.traction_metrics
  - business_model.unit_economics
  - financing_milestone.funding_need
  - financing_milestone.milestone_plan
  - round_readiness.burn_runway
  - round_readiness.round_terms
  - legal_readiness.legal_entity
  - ip_fto.ip_position
  - regulatory.classification_route

# --- Скоринг и вердикт --------------------------------------------------------
scoring:
  critical_item_weight: 2.0
  # PASS = вне тезиса ИЛИ пустая заявка. Порог по readiness НЕ используется:
  # readiness зависит от размера чек-листа (маршрут MEDICAL_DEVICE даёт 36 слотов,
  # и нормальная seed-заявка набирает ~10). Низкая доказательность до раунда — HOLD.
  pass_min_substantive_claims: 3
  next_min: 45
  max_critical_gaps_for_next: 1

# --- Поля формы Tilda («Имя переменной» в настройках поля) --------------------
form:
  contact_fields:
    project_name: company
    founder_name: name
    founder_email: email
    consent: consent
    project_id: project_id        # опционально: VC-ID, если уже присвоен фондом
  routing_fields:                 # те же значения, что в тренажёре (routing_v2)
    jurisdiction: jurisdiction    # RF | EAEU | EU | US | GCC | MULTI (или РФ, ЕАЭС…)
    ls_stage: ls_stage            # HQ-016 (опц.): idea | poc | preclinical | clinical | registration | registered | pilot | sales
    target_markets: target_markets
    product_class: product_class  # THERAPEUTIC | MEDICAL_DEVICE | SOFTWARE_POTENTIAL_MD | IVD | LAB_SERVICE | WELLNESS_INFORMATION | RESEARCH_ONLY
    intended_use: intended_use
  file_fields:
    pitch_deck: pitch_deck        # PDF
    fin_model: fin_model          # XLSX
    evidence: evidence_files      # опц.: договоры, акты, выписки, LOI (можно несколько)
  questions:
    - {name: q_team, block: team, label: "Кто фаундеры, их релевантный опыт, кто работает full-time, как распределены доли?"}
    - {name: q_hiring, block: team, label: "Каких ключевых людей не хватает и когда вы их наймёте?"}
    - {name: q_problem, block: problem_market, label: "Какую проблему решаете и как подтвердили, что клиенты за неё платят?"}
    - {name: q_market, block: problem_market, label: "Кто покупатель и какой объём рынка вы считаете реалистичным (bottom-up)?"}
    - {name: q_product, block: product, label: "На какой стадии продукт и чем он технологически отличается от альтернатив?"}
    - {name: q_ip, block: risks_legal, label: "Кому принадлежат IP, код и данные? Есть ли патенты/заявки?"}
    - {name: q_traction, block: traction, label: "Текущая выручка / пользователи и динамика за 6 месяцев?"}
    - {name: q_customers, block: traction, label: "Какие пилоты, LOI, договоры есть? С кем, на какую сумму?"}
    - {name: q_model, block: business_model, label: "Как зарабатываете, сколько стоит привлечь клиента, какова маржа и отток?"}
    - {name: q_burn, block: finance_round, label: "Ежемесячный burn и runway на сегодня?"}
    - {name: q_round, block: finance_round, label: "Сколько привлекаете, на каких условиях (оценка, инструмент), кто уже в раунде?"}
    - {name: q_use_of_funds, block: finance_round, label: "На что пойдут деньги и какой проверяемой вехи достигнете?"}
    - {name: q_legal, block: risks_legal, label: "Юрлицо, холдинг, структура владения?"}
    - {name: q_risks, block: risks_legal, label: "Регуляторный путь и три главных риска, как вы их видите?"}

# =============================================================================
# HQ-016 v1.1 · «не применимо по стадии ≠ 0» для LS (LS_CHECKLIST_S1_v0.1)
# Веса блоков и пороги scoring НЕ меняются. Вторая шкала НЕ вводится: К1–К6 —
# обычные слоты чек-листа, оцениваются той же шкалой E0–E4 и теми же потолками
# по источнику (без документа — не выше E2). Блоки К-слотов — по уже действующей
# группировке модулей (clinical/science/cmc → product; regulatory/ip_fto →
# risks_legal; reimbursement → business_model).
# =============================================================================
ls_stage_rule:
  # условие 2: тип актива требует регистрации (ЛП/биотех, МИ, ПО-МИ, IVD)
  asset_classes: [THERAPEUTIC, MEDICAL_DEVICE, SOFTWARE_POTENTIAL_MD, IVD]
  # условие 3: идея, PoC, доклиника, КИ, регистрация в процессе (нет РУ, пилота, продаж)
  pre_registration_stages:
    idea: "идея"
    poc: "PoC"
    preclinical: "доклиника"
    clinical: "КИ (фаза I–III / испытания МИ)"
    registration: "регистрация в процессе"
  post_registration_stages: [registered, pilot, sales]
  # IT-слоты (выручка/MRR, трекшн, юнит-экономика) — уровень слота, не блока
  it_slots:
    traction.traction_metrics:
      risk: "Спрос и выручка не подтверждены — проверяются после РУ / первого пилота"
    traction.retention:
      risk: "Удержание клиентов не измеримо до выхода на рынок"
    business_model.unit_economics:
      risk: "Юнит-экономика (CAC/LTV, маржа) не подтверждена до продаж"
  na_reason: "стадия: {stage}; продаж до РУ быть не может"
  future_milestone: "станет оцениваемым после РУ / первого пилота"
  barriers_min: 2
  barriers_max: 5
  # порядок LS-барьеров по v0.2: регуляторный трек, клинические данные, IP, производство, возмещение
  barrier_order: ["К2", "К1", "К4", "К3", "К5", "К6"]

ls_milestones:
  ls_milestones_product:
    - {slot: k1_clinical_stage, k: "К1", label: "К1 · Стадия разработки / КИ, готовность прототипа",
       why: "Стадия актива (in vitro / in vivo доклиника / фаза I–III; для МИ — макет / прототип / предсерийный образец) и документ, который это подтверждает.",
       next_step: "Зафиксировать протокол следующего исследования (дизайн, модель, n, endpoints) или заключить договор с аккредитованной лабораторией на испытания прототипа и получить протокол."}
    - {slot: k4_science_poc, k: "К4", label: "К4 · Научный proof of concept",
       why: "Механизм / мишень и эксперимент, показавший, что он работает: модель, n, контроль, primary endpoint, воспроизведение вне своей лаборатории.",
       next_step: "Повторить ключевой эксперимент в независимой лаборатории с заранее зафиксированным endpoint и расчётом n."}
    - {slot: k5_manufacturing, k: "К5", label: "К5 · Производство / GMP / СМК",
       why: "Кто и где произведёт серию для доклиники/КИ; лицензия и заключение GMP (ЛП) или СМК и готовность к инспектированию производства (МИ).",
       next_step: "Получить от CDMO копию лицензии/заключения GMP и предложение на пилотную серию либо запустить внедрение СМК под инспектирование производства."}
  ls_milestones_risks:
    - {slot: k2_regulatory_path, k: "К2", label: "К2 · Регуляторный трек",
       why: "Где первая регистрация и по какому пути, заявленный класс риска и чем он подтверждён.",
       next_step: "Запросить консультацию экспертного учреждения по классу и процедуре (п. 50 ПП № 1684) и приложить карту: юрисдикция → класс → процедура → каких модулей досье нет."}
    - {slot: k3_ip, k: "К3", label: "К3 · Интеллектуальная собственность",
       why: "Поданные заявки, выданные патенты, ноу-хау; правообладатель; был ли FTO.",
       next_step: "Подать заявку на изобретение (или PCT) до публикации данных и оформить передачу прав от вуза/авторов."}
  ls_milestones_market:
    - {slot: k6_reimbursement, k: "К6", label: "К6 · Возмещение / кто платит",
       why: "Кто конкретно будет платить после регистрации и что нужно доказать этому плательщику.",
       next_step: "Провести 5 интервью с закупщиками/главврачами и записать, какой endpoint и какие данные они потребуют для закупки."}

# HQ-016 §5: role-config S1 (SKILLS-REGISTRY-R1: SK-01, 02, 03, 04, 07, 08, 11) + SK-05, SK-06.
# Облегчённые S1-версии; привязка SK-05/SK-06 к S2/S3 здесь не задаётся и не меняется.
role_config:
  S1:
    skills: [SK-01, SK-02, SK-03, SK-04, SK-05, SK-06, SK-07, SK-08, SK-11]
    skill_notes:
      SK-05: {name: "Clinical Evidence", s1_scope: "облегчённая S1-версия", criteria: ["К1", "К4"], source: "LS_CHECKLIST_S1_v0.1"}
      SK-06: {name: "Regulatory Path", s1_scope: "облегчённая S1-версия", criteria: ["К2"], source: "LS_CHECKLIST_S1_v0.1"}

# =============================================================================
# HQ-016 T6 · Зоны LS-барьеров З1–З7 (LS_CHECKLIST_S1_v0.2 §7, аддендум v0.1).
# Зоны НЕ меняют балл. Статусы зоны: «сейчас» / «будущая веха» / «не применимо» /
# «не оценено, нужен ответ» (нет сигнала в анкете → вопрос в диалог Р0/Р1, HQ-020).
# Стадии v0.2: ЛП — Д, Ф1, Ф2, Ф3, Рег; МИ — П, ТИ, КИ-МИ, Рег-МИ.
# Основания — только акты из v0.2 с меткой статуса источника как в v0.2.
# =============================================================================
ls_stage_derivation:      # стадия из существующих ответов анкеты (поля ls_stage в Tilda до 05.11 нет)
  fields: [q_product, intended_use, q_traction, q_customers]
  keywords:               # первый найденный класс; несколько разных классов → «уточнить в диалоге»
    sales: ["продаж", "выручк", "mrr", "платящ"]
    registered: ["ру получ", "регистрационное удостоверение получ", "зарегистрирован"]
    registration: ["на регистрац", "регистрация в процессе", "подали досье", "экспертиза досье"]
    clinical: ["клинические испытания", "клиническое исследование", "фаза i", "фаза ii", "фаза iii", "фаза 1", "фаза 2", "фаза 3", "ки-ми"]
    preclinical: ["доклиник", "in vivo", "in vitro", "токсиколог", "технические испытания"]
    poc: ["proof of concept", "poc", "прототип", "макет"]
    idea: ["идея", "концепц"]
  phase_keywords: {Ф1: ["фаза i ", "фаза 1"], Ф2: ["фаза ii ", "фаза 2"], Ф3: ["фаза iii", "фаза 3"]}
  uncertain_label: "не подтверждена"   # PM 11.10 (HQ-020): неопределённая стадия в отчёте — «не подтверждена»
  clarify_question: "На какой стадии актив сейчас: идея / PoC / доклиника / КИ (какая фаза) / регистрация в процессе / РУ получено / первые продажи? Каким документом это подтверждается?"
  # МИ: пилот до регистрации — веха со статусом «заявление» (не выше E1), не признак выхода на рынок
  device_pilot_slots: [pilots_workflow.pilot_design, pilots_workflow.workflow_integration]
  device_pilot_max_level: 1

ls_zone_signals:          # сигналы, которых в анкете нет → зона «не оценено, нужен ответ»
  orphan_paediatric: "Относится ли показание к орфанным / тяжёлым заболеваниям или продукт предназначен для детей?"
  biomaterials: "Работаете ли вы с биообразцами человека, клеточными линиями, ГМО или патогенами (ПБА), планируете ли ввоз/вывоз образцов?"
  hospital_drug: "Будет ли препарат применяться в стационаре (оплата случая по КСГ ОМС)?"
  drug_phase: "Какая фаза КИ сейчас: I, II или III?"

ls_zones:
  - id: З1
    title: "Перечни ЖНВЛП и ВЗН"
    k: К6
    question: "Будет ли препарат претендовать на включение в ЖНВЛП (или в перечень ВЗН)? Какое МНН, какие препараты-компараторы по этому МНН/АТХ уже в перечне?"
    rules:
      drug: {Д: веха, Ф1: веха, Ф2: сейчас, Ф3: сейчас, Рег: сейчас_критично, unknown_phase: drug_phase}
      device: {all: не_применимо, reason: "МИ: перечни ЖНВЛП/ВЗН касаются ЛП"}
    basis: ["Распоряжение Правительства РФ от 18.12.2025 № 3867-р — ПОДТВЕРЖДЕНО (government.ru)",
            "ПП РФ от 28.08.2014 № 871 — ПОДТВЕРЖДЕНО (Минздрав); критерии включения — по зеркалу"]
    next_step: "Сверить МНН/АТХ с перечнем ЖНВЛП по Распоряжению № 3867-р, выписать компараторы и заложить сравнение с ними в протокол Ф3"
  - id: З2
    title: "Тарифы ОМС / КСГ"
    k: К6
    question: "В какой единице оплаты ОМС будет использоваться ваш продукт: случай госпитализации по КСГ, случай в дневном стационаре, посещение, исследование?"
    rules:
      drug: {signal: hospital_drug}
      device: {П: веха, ТИ: веха, КИ-МИ: сейчас, Рег-МИ: сейчас_критично}
    basis: ["ПП РФ от 29.12.2025 № 2188 — реквизиты ПОДТВЕРЖДЕНЫ, цитата — по зеркалу"]
    next_step: "Найти в ПГГ № 2188 и методрекомендациях на 2026 год КСГ или вид исследования, где будет применяться изделие, и сравнить стоимость изделия на случай со структурой тарифа"
  - id: З3
    title: "Фонд «Круг добра»: орфанный и педиатрический трек"
    k: К6
    question: "Входит ли нозология в Перечень заболеваний Фонда? Целевая популяция — дети?"
    rules:
      drug: {signal: orphan_paediatric}
      device: {signal: orphan_paediatric}
    basis: ["Указ Президента РФ от 05.01.2021 № 16 (ред. от 06.02.2023 № 73) — ПОДТВЕРЖДЕНО",
            "Перечни Фонда — НЕ ПОДТВЕРЖДЕНО (сайт Фонда не открылся)"]
    next_step: "Сверить нозологию с Перечнем заболеваний Фонда и записать контрольные точки эффективности и безопасности до подачи на экспертный совет"
  - id: З4
    title: "Производство: GMP (ЛП) / СУК (МИ)"
    k: К5
    question: "Где будут произведены серии / изделия; есть ли лицензия и GMP (ЛП) или СУК по ПП № 136 (МИ)?"
    rules:
      drug: {Д: сейчас, Ф1: сейчас, Ф2: сейчас, Ф3: сейчас_критично, Рег: сейчас_критично}
      device: {П: сейчас, ТИ: сейчас, КИ-МИ: сейчас, Рег-МИ: сейчас_критично}
      software_device: {all: не_разобрано, reason: "в v0.2 для ПО-МИ не разобрано — НЕ ПОДТВЕРЖДЕНО"}
    basis: ["ЛП: Решение Совета ЕЭК от 03.11.2016 № 77 (Правила GMP ЕАЭС) — реквизиты ПОДТВЕРЖДЕНЫ",
            "МИ: ПП РФ от 09.02.2022 № 135 — ПОДТВЕРЖДЕНО (government.ru); ПП РФ № 136 — ПОДТВЕРЖДЕНО (РЗН); инспектирует Росздравнадзор через ФГБУ"]
    next_step: "ЛП: получить от CDMO копию лицензии Минпромторга и сертификата GMP ЕАЭС. МИ: внедрить СУК по ПП № 136 и подать заявку на первичное инспектирование до подачи на регистрацию"
  - id: З5
    title: "Интеллектуальная собственность (никогда не «не применимо»)"
    k: К3
    question: "Что именно покрывает формула: вещество, способ, применение, устройство? Подавалась ли заявка до публикаций? Планируете ли PCT?"
    rules:
      drug: {all: сейчас_критично}
      device: {all: сейчас_критично}
    basis: ["ГК РФ ст. 1395, Роспатент как получающее ведомство PCT — ПОДТВЕРЖДЕНО (ФИПС)",
            "PCT (WIPO) — ПОДТВЕРЖДЕНО (WIPO)"]
    next_step: "Подать заявку на изобретение в Роспатент до публикации; через 6 месяцев — PCT; заказать у поверенного claim chart"
  - id: З6
    title: "Биоматериалы, ГМО, клеточные линии, патогены"
    k: null
    question: "С чем вы работаете: биообразцы человека, клеточные линии, ГМО, ПБА? Будете ли отправлять образцы за рубеж или ввозить штаммы?"
    rules:
      drug: {signal: biomaterials}
      device: {signal: biomaterials}
    basis: ["ПП РФ от 25.01.2022 № 46 (Роспотребнадзор) — ПОДТВЕРЖДЕНО",
            "ПП РФ от 14.03.2022 № 363 (Минздрав, биоматериалы КИ ЛП) — ПОДТВЕРЖДЕНО"]
    next_step: "Составить реестр биоматериалов и агентов с группой патогенности и сверкой по ПП № 1287; до договора с зарубежной лабораторией запросить заключение РЗН (или Минздрава — для КИ ЛП)"
  - id: З7
    title: "Регистрация ЛП по праву ЕАЭС (отдельно от МИ)"
    k: К2
    question: "Какое референтное государство и государства признания? Готов ли модуль 3 (CMC) и сертификат GMP ЕАЭС площадки?"
    rules:
      drug: {Д: веха, Ф1: сейчас, Ф2: сейчас, Ф3: сейчас_критично, Рег: сейчас_критично}
      device: {all: не_применимо, reason: "МИ регистрируется по К2 (ПП № 1684 / Решение № 46), не по З7"}
    basis: ["Решение Совета ЕЭК от 03.11.2016 № 78 — ПОДТВЕРЖДЕНО (Минздрав)"]
    next_step: "Собрать gap-лист досье ОТД по Решению № 78 и отметить, каких данных не будет к концу Ф2"

# =============================================================================
# HQ-020 · Диалог раздела 1 (Р0/Р1/Р2) и бесплатная часть S1.
# Лимиты 7/12/5, два раунда — рабочие значения PM S1 до итогов пилота HQ-019 (бриф HQ-020 §2).
# =============================================================================
dialogue_s1:
  limits: {r0: 7, r1: 12, r2: 5, clarifications_r1: 2, rounds: 2}
  # порядок важности Р1 (бриф §2 п. 3): К1 → К2 → К4 → К3 → К7 → К5 → К6 → команда/деньги → З «сейчас»
  r1_order: ["К1", "К2", "К4", "К3", "К7", "К5", "К6", "team_money", "zones_now"]
  r2_overflow_reason: "не запрашивалось: лимит досылки"
  text_only_max_level: 2       # A4: текст без файла не даёт больше 2
free_part_s1:
  label: "ИИ-оценка, не инвестиционная рекомендация"
  gaps: 3
  stage_unconfirmed: "не подтверждена"
  forbidden_labels: ["PASS", "HOLD", "NEXT"]

# HQ-020 · Банк вопросов S1_DIALOG_SCENARIO_v0.1 §3 (формулировки дословно).
# proposal: true — в сценарии помечено «предложение PM S1, утвердить».
dialogue_questions_s1:
  r0:
    - {id: Q0.1, text: "Одной-двумя фразами: что делает ваш продукт и для кого — пациент, врач, клиника, лаборатория?"}
    - {id: Q0.2, text: "Где ваш первый рынок на ближайшие 24 месяца: Россия, ЕАЭС, ЕС, США или другое?", gate: jurisdiction}
    - {id: Q0.3, text: "Что это по типу: лекарство, медицинское изделие, программа как медизделие, диагностика in vitro, сервис или wellness? Если не уверены, так и скажите — разберёмся вместе", gate: product_class}
    - {id: Q0.4, text: "На какой стадии вы сейчас? Лекарство: in vitro, доклиника на животных, фаза I, II или III. Изделие: макет, рабочий прототип или предсерийный образец", stage: true}
    - {id: Q0.5, text: "Есть ли у вас регистрационное удостоверение, первый пилот, продажи или платящие клиенты? Если да, чем это подтверждается?"}
    - {id: Q0.6, text: "Что вам нужно от инвестора: сколько денег, на что и к какой вехе?"}
    - {id: Q0.7, text: "Продукт для редкого заболевания или для детей?", only: [THERAPEUTIC, MEDICAL_DEVICE, SOFTWARE_POTENTIAL_MD, IVD], signal: orphan_paediatric}
  r1_ls:   # ключ: К → ветка актива (drug / device / software)
    К1:
      drug: "На какой стадии препарат: in vitro, доклиника in vivo, фаза I, II или III? Какой документ это подтверждает — отчёт доклиники, протокол, разрешение на КИ?"
      device: "Что есть сейчас: макет, рабочий прототип или предсерийный образец? Были ли технические испытания или токсикологические исследования, в какой лаборатории?"
      software: "Какая версия программы работает и на каких данных её проверяли? Есть ли протокол испытаний?"
    К2:
      drug: "Где и как будете регистрировать препарат? Новые ЛП регистрируются по праву ЕАЭС (Решение № 78), отдельно от изделий. Есть ли план досье — какие модули есть, каких нет?"
      device: "По какому пути первая регистрация: РФ (ПП № 1684) или ЕАЭС (Решение № 46), ЕС, США? Какой класс риска вы заявляете и чем это подтверждено — консультацией экспертного учреждения, письмом, обоснованием по классификации?"
      software: "По какому пути первая регистрация: РФ (ПП № 1684) или ЕАЭС (Решение № 46), ЕС, США? Какой класс риска вы заявляете и чем это подтверждено — консультацией экспертного учреждения, письмом, обоснованием по классификации? Есть ли описание назначения программы (intended use)?"
    К4:
      drug: "Какой механизм и какой эксперимент показал, что он работает: модель, n, контроль, главный показатель? Повторяли ли результат вне своей лаборатории?"
      device: "Какой механизм и какой эксперимент показал, что он работает: модель, n, контроль, главный показатель? Повторяли ли результат вне своей лаборатории?"
      software: "Проверяли ли модель на независимом наборе данных — внешняя валидация?"
    К3:
      drug: "Что защищено: заявки, патенты (номер, страна, статус), ноу-хау? Кто правообладатель — компания, вуз, автор? Подавали ли заявку до публикаций? Делали ли FTO?"
      device: "Что защищено: заявки, патенты (номер, страна, статус), ноу-хау? Кто правообладатель — компания, вуз, автор? Подавали ли заявку до публикаций? Делали ли FTO? Защищено устройство или способ?"
      software: "Что защищено: заявки, патенты (номер, страна, статус), ноу-хау? Кто правообладатель — компания, вуз, автор? Подавали ли заявку до публикаций? Делали ли FTO? Что именно вы патентуете, если программа \"как таковая\" изобретением не считается?"
    К7:
      all: "Какой один документ или результат за 30–90 дней сильнее всего снизит риск для инвестора? Кто в команде за него отвечает? Какой профильный эксперт нужен и есть ли он?"
    К5:
      drug: "Кто и где произведёт серию для доклиники или КИ? Есть ли у площадки лицензия и подтверждение GMP?"
      device: "Внедрена ли система управления качеством? Когда первичное инспектирование производства?"
      software: "Внедрена ли система управления качеством? Когда первичное инспектирование производства?"
    К6:
      drug: "Кто конкретно будет платить после регистрации: пациент, частная клиника, ДМС, ОМС, закупки по 44-ФЗ или 223-ФЗ, фарм-партнёр? Говорили ли вы с ним? Есть ли запись или письмо?"
      device: "Кто конкретно будет платить после регистрации: пациент, частная клиника, ДМС, ОМС, закупки по 44-ФЗ или 223-ФЗ, фарм-партнёр? Говорили ли вы с ним? Есть ли запись или письмо?"
      software: "Кто конкретно будет платить после регистрации: пациент, частная клиника, ДМС, ОМС, закупки по 44-ФЗ или 223-ФЗ, фарм-партнёр? Говорили ли вы с ним? Есть ли запись или письмо? Есть ли РУ МИ? Программа госгарантий учитывает только зарегистрированные МИ с ИИ"
  r1_common:
    - {id: Q1.T, text: "Кто в команде отвечает за науку, регуляторику, производство и деньги? Кто работает полный день?", proposal: true}
    - {id: Q1.M, text: "Сколько денег есть сейчас и на сколько месяцев их хватит? Сколько просите в раунде и к какой вехе эти деньги вас приведут?", proposal: true}
    - {id: Q1.R, text: "Уточню: есть ли у вас уже выручка, продажи, предзаказы или платящие клиенты?", ls_only: true}
    - {id: Q1.Z6, text: "Работаете ли вы с биообразцами человека, клеточными линиями, ГМО или патогенами? Планируете ли отправлять образцы за рубеж или ввозить их?", ls_only: true, signal: biomaterials}
  r1_it:   # путь IT; сценарий §3.4 — «предложение PM S1, утвердить»
    - {id: Q1.IT1, text: "Какая у вас выручка за последний период и чем она подтверждается — выпиской, счетами?", proposal: true}
    - {id: Q1.IT2, text: "Сколько платящих клиентов и сколько из них продлили?", proposal: true}
    - {id: Q1.IT3, text: "Сколько стоит привлечь клиента и сколько он приносит?", proposal: true}
  zones_now:   # §3.5: отдельный вопрос только по зоне «сейчас»
    З1: "Какие препараты-компараторы по вашему МНН уже в перечне ЖНВЛП? Заложено ли сравнение с ними в протокол Ф3?"
    З2: "В какой единице оплаты ОМС будет использоваться продукт — КСГ, посещение, исследование?"
    З3: "Входит ли нозология в Перечень заболеваний Фонда? Какие контрольные точки КИ будут к подаче?"
    З6: "Есть ли реестр материалов с группой патогенности и лицензия у площадки?"
  r2_priority: ["К2", "К4", "К1", "К3", "К7"]      # §4.1: если кандидатов > 5
  text_answer_level: 1                              # §3.0: устный ответ без документа — максимум 2 балла, E1
  pack_disclaimer: "Подтвердить у эксперта / регулятора. Не инвестиционная рекомендация, не юридическое заключение, не медицинский совет"

# HQ-020 · Вертикаль LS/HT (решение PM 11.10).
vertical_s1:
  in_classes: [THERAPEUTIC, MEDICAL_DEVICE, SOFTWARE_POTENTIAL_MD, IVD, RESEARCH_ONLY]
  out_classes: [WELLNESS_INFORMATION]
  # рабочие списки слов исполнителя — утвердить PM
  clinical_words: ["клиник", "пациент", "диагност", "лечени", "терапи", "медицин", "врач", "регистрац", "медизделие"]
  out_words: ["saas", "финтех", "fintech", "e-commerce", "интернет-магазин", "маркетплейс", "фитнес", "wellness"]
  out_of_scope_message: "Спасибо за заявку. S1 сейчас работает только с проектами в науках о жизни и медицине (LS/HT), поэтому оценку по вашему проекту мы не проводим."
